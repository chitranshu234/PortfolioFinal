<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <rect width="128" height="128" rx="24" fill="#18181b"/>
  <!-- Controller (Top) -->
  <rect x="36" y="20" width="56" height="24" rx="6" fill="#3b82f6"/>
  <text x="64" y="36" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle" dominant-baseline="middle">CTRL</text>
  
  <!-- View (Left) -->
  <rect x="18" y="76" width="40" height="28" rx="6" fill="#10b981"/>
  <text x="38" y="93" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle" dominant-baseline="middle">VIEW</text>
  
  <!-- Model (Right) -->
  <rect x="70" y="76" width="40" height="28" rx="6" fill="#f59e0b"/>
  <text x="90" y="93" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle" dominant-baseline="middle">MODEL</text>
  
  <!-- Connecting lines -->
  <path d="M50 44 L38 76" stroke="#60a5fa" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M78 44 L90 76" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M58 90 L70 90" stroke="#94a3b8" stroke-width="2.5" stroke-dasharray="3 3"/>
</svg>
